<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وصول للسفريات - Wusul Travel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#eef2f7;margin:0;padding:10px}
.header{background:#0f172a;color:#fff;padding:16px;border-radius:16px;text-align:center}
.card{background:#fff;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 2px 8px #0001}
input,select,button{padding:11px;border-radius:10px;border:1px solid #ddd;width:100%;margin:5px 0;font-size:15px}
button{background:#0f172a;color:#fff;font-weight:700;cursor:pointer}
button.green{background:#16a34a}button.blue{background:#2563eb}button.orange{background:#ea580c}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;font-size:12px;text-align:right}
.ticket{border:2px dashed #111;padding:16px;background:#fff;line-height:1.7}
.badge{background:#dcfce7;color:#166534;padding:3px 8px;border-radius:20px;font-size:11px}
</style>
</head>
<body>

<div class="header"><h2 style="margin:0">🚌 وصول للسفريات | Wusul Travel</h2><small>متصل بـ Supabase ✅ gdnrwwkihllnkvmnhpyb | wwwroot/index.html + ASP.NET جاهز</small></div>

<div class="card" style="background:#fffbeb;border:1px solid #fcd34d">
<h3>🔍 البحث عن تذكرة برقم التلفون</h3>
<div style="display:flex;gap:6px"><input id="searchPhone" placeholder="ادخل رقم التلفون 091..."><button class="orange" onclick="searchTicket()" style="width:120px">بحث</button></div>
<div id="searchResult"></div>
</div>

<div class="grid">
<div class="card"><h3>إضافة باص</h3><input id="comp" placeholder="اسم الشركة - وصول"><input id="btype" placeholder="VIP / ممتاز"><input id="plate" placeholder="رقم اللوحة"><input id="seats" type="number" value="45"><button onclick="addBus()">حفظ الباص</button></div>
<div class="card"><h3>إضافة رحلة</h3><input id="from" placeholder="من - الخرطوم"><input id="to" placeholder="إلى - عطبرة"><label>انطلاق</label><input id="dep" type="datetime-local"><label>وصول</label><input id="arr" type="datetime-local"><input id="price" type="number" placeholder="السعر SDG"><select id="busSel"></select><button class="blue" onclick="addTrip()">حفظ الرحلة</button></div>
</div>

<div class="card"><h3>حجز تذكرة + بيانات العفش</h3>
<div class="grid"><div><input id="pname" placeholder="اسم المسافر"><input id="phone" placeholder="تلفون"><input id="nid" placeholder="رقم وطني / جواز"><input id="seat" type="number" placeholder="رقم المقعد"></div><div><select id="tripSel"></select><input id="lugDesc" placeholder="بيانات العفش - شنطة كبيرة + يد"><input id="lugWeight" type="number" placeholder="وزن كجم"><input id="amount" type="number" placeholder="المبلغ"><input id="agency" value="وكالة وصول للسفريات"><input id="agencyPhone" value="0911234567"></div></div>
<button class="green" onclick="addTicket()">🎫 حجز وطباعة التذكرة</button>
</div>

<div class="card"><h3>كل التذاكر <span class="badge" id="count">0</span></h3><table><thead><tr><th>المسافر</th><th>الرحلة</th><th>مقعد</th><th>المبلغ</th><th>طباعة</th></tr></thead><tbody id="tb"></tbody></table></div>
<div id="printArea"></div>

<script>
const SUPA_URL='https://gdnrwwkihllnkvmnhpyb.supabase.co';
const SUPA_KEY='sb_publishable_X_jH5mVcNZinc2yRYqkwiQ_RYlIvZmw';
const supabaseClient = supabase.createClient(SUPA_URL, SUPA_KEY);

async function loadBuses(){
 let {data}=await supabaseClient.from('buses').select('*');
 let s=document.getElementById('busSel'); s.innerHTML='';
 (data||[]).forEach(b=>s.innerHTML+=`<option value="${b.id}">${b.company_name} - ${b.bus_type} - ${b.plate_number}</option>`);
}
async function loadTrips(){
 let {data}=await supabaseClient.from('trips').select('*');
 let s=document.getElementById('tripSel'); s.innerHTML='';
 (data||[]).forEach(t=>s.innerHTML+=`<option value="${t.id}">${t.from_city} → ${t.to_city} | ${new Date(t.departure_time).toLocaleString()} | ${t.price} SDG</option>`);
 return data||[];
}
async function loadTickets(){
 let {data}=await supabaseClient.from('tickets').select('*, trips(*)').order('created_at',{ascending:false});
 document.getElementById('count').innerText=(data||[]).length;
 let tb=document.getElementById('tb'); tb.innerHTML='';
 (data||[]).forEach(t=>{
  let trip=t.trips; let route=trip?`${trip.from_city}→${trip.to_city}`:'';
  tb.innerHTML+=`<tr><td>${t.passenger_name}<br><small>${t.phone}</small></td><td>${route}<br><small>${trip?new Date(trip.departure_time).toLocaleDateString():''}</small></td><td>${t.seat_number}</td><td>${t.total_amount}</td><td><button class="blue" onclick='printTicket(${JSON.stringify(t).replace(/'/g,"&#39;")})'>🖨️</button></td></tr>`;
 });
}

async function searchTicket(){
 let ph=searchPhone.value.trim();
 if(!ph){alert('ادخل رقم التلفون');return;}
 let {data}=await supabaseClient.from('tickets').select('*, trips(*), trips!inner(buses(*))').eq('phone',ph);
 let div=document.getElementById('searchResult');
 if(!data||data.length==0){div.innerHTML='<p style="color:red">لا توجد تذاكر بهذا الرقم</p>';return;}
 div.innerHTML='';
 data.forEach(t=>{
  let trip=t.trips;
  div.innerHTML+=`<div class="ticket"><b>المسافر:</b> ${t.passenger_name} | <b>تلفون:</b> ${t.phone}<br><b>الرحلة:</b> ${trip?.from_city} → ${trip?.to_city} | <b>مقعد:</b> ${t.seat_number}<br><b>العفش:</b> ${t.luggage_desc} (${t.luggage_weight} كجم) | <b>المبلغ:</b> ${t.total_amount} SDG<br><button class="blue" onclick='printTicket(${JSON.stringify(t).replace(/'/g,"&#39;")})'>طباعة التذكرة</button></div>`;
 });
}

async function addBus(){
 let {error}=await supabaseClient.from('buses').insert({company_name:comp.value,bus_type:btype.value,plate_number:plate.value,seats_count:parseInt(seats.value)||45});
 if(error) alert(error.message); else {alert('تم حفظ الباص ✅'); loadBuses();}
}
async function addTrip(){
 let {error}=await supabaseClient.from('trips').insert({from_city:from.value,to_city:to.value,departure_time:dep.value,arrival_time:arr.value,price:parseFloat(price.value),bus_id:busSel.value});
 if(error) alert(error.message); else {alert('تم حفظ الرحلة ✅'); loadTrips();}
}
async function addTicket(){
 let {data,error}=await supabaseClient.from('tickets').insert({passenger_name:pname.value,phone:phone.value,national_id:nid.value,seat_number:parseInt(seat.value),trip_id:tripSel.value,luggage_desc:lugDesc.value,luggage_weight:parseFloat(lugWeight.value)||0,total_amount:parseFloat(amount.value),agency_name:agency.value,agency_phone:agencyPhone.value}).select('*, trips(*)').single();
 if(error){alert(error.message);return;}
 alert('تم الحجز ✅'); loadTickets(); printTicket(data);
}
function printTicket(t){
 let trip=t.trips||{};
 let html=`<div class="ticket" style="font-family:system-ui"><h2 style="text-align:center;margin:0">🎫 تذكرة سفر - ${t.agency_name}</h2><p style="text-align:center">${t.agency_name} | ${t.agency_phone}</p><hr><p><b>اسم المسافر:</b> ${t.passenger_name}</p><p><b>تلفون:</b> ${t.phone} | <b>هوية:</b> ${t.national_id||'-'}</p><p><b>رقم المقعد:</b> ${t.seat_number} | <b>المبلغ:</b> ${t.total_amount} SDG</p><hr><p><b>من:</b> ${trip.from_city||''} <b>إلى:</b> ${trip.to_city||''}</p><p><b>انطلاق:</b> ${trip.departure_time?new Date(trip.departure_time).toLocaleString('ar-SD'):''}</p><p><b>وصول:</b> ${trip.arrival_time?new Date(trip.arrival_time).toLocaleString('ar-SD'):''}</p><hr><p><b>بيانات العفش:</b> ${t.luggage_desc||'لا يوجد'}</p><p><b>وزن العفش:</b> ${t.luggage_weight} كجم</p><p><b>نوع الباص:</b> ${trip.buses?.bus_type||trip.bus_id||''}</p><hr><p style="text-align:center;font-size:12px">تاريخ الحجز: ${new Date(t.created_at).toLocaleString('ar-SD')} | رحلة سعيدة مع وصول للسفريات</p></div>`;
 document.getElementById('printArea').innerHTML=html;
 let w=window.open('','','width=420,height=750'); w.document.write(`<html><head><title>تذكرة</title><style>body{font-family:system-ui;padding:12px}.ticket{border:2px dashed #000;padding:16px}</style></head><body>${html}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`); w.document.close();
}

loadBuses(); loadTrips(); loadTickets();
</script>
</body>
                                                                                                                                                                                                                                                                                                       </html>
